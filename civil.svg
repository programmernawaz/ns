<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#2E7D32" />

  <!-- Scales of Justice -->
  <rect x="50" y="30" width="10" height="120" fill="#FFFFFF" />
  <rect x="40" y="30" width="30" height="10" fill="#FFFFFF" />
  <rect x="35" y="150" width="40" height="10" fill="#FFFFFF" />

  <!-- Book of Law -->
  <rect x="120" y="30" width="70" height="120" fill="#4CAF50" />

  <!-- Gavel -->
  <rect x="220" y="30" width="20" height="80" fill="#4CAF50" />
  <rect x="215" y="30" width="30" height="10" fill="#4CAF50" />

  <!-- Text -->
  <text x="80" y="180" font-family="Arial" font-size="20" fill="#FFFFFF">Civil Law</text>
</svg>
